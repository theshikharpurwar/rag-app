# FILE: docker-compose.yml (Simplified for Host Ollama setup)

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      # Mount uploads volume for persistent storage
      - uploads_data:/app/backend/uploads
      # Cache HuggingFace models so reranker is only downloaded once
      - hf_cache:/root/.cache/huggingface
    environment:
      - MONGODB_URI=mongodb://mongo:27017/rag_db
      # For accessing Ollama on the host machine
      - OLLAMA_HOST_URL=http://host.containers.internal:11434
      # Optional per-request Ollama tuning (see DEPLOYMENT.md — host uses OLLAMA_NUM_PARALLEL / FLASH_ATTENTION)
      # - OLLAMA_NUM_BATCH=1024
      # - OLLAMA_NUM_CTX=4096
      # - OLLAMA_KEEP_ALIVE=10m
      # Models defined in python/config/models.py - keep in sync
      - LLM_MODEL=qwen3.5:0.8b
      - EMBEDDING_MODEL=nomic-embed-text:v1.5
      - NODE_ENV=production
      # Persistent Python query server (inside same container)
      - PYTHON_QUERY_URL=http://127.0.0.1:5001
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Cache HuggingFace models in the mounted volume
      - HF_HOME=/root/.cache/huggingface
      # Set to 'true' to use Docling for PDF extraction (better quality, slower upload)
      # Disabled by default — loads heavy ML models (~300MB) competing with Ollama on 8GB RAM
      - USE_DOCLING=false
      # Set to 'true' to disable reranking (saves memory on constrained hosts)
      - SKIP_RERANKING=${SKIP_RERANKING:-false}
      # Optional reranker tuning
      # - RERANKER_MODEL=BAAI/bge-reranker-v2-m3
      # - RERANK_TOP_M=50
      - RERANKER_TYPE=${RERANKER_TYPE:-cross_encoder}
      - COLBERT_MODEL=${COLBERT_MODEL:-colbert-ir/colbertv2.0}
      # Skip image embedding — OllamaEmbedder only handles text, not images
      - SKIP_IMAGES=true
      # Phase 2: Hybrid Retrieval & Knowledge Graphs
      - ENABLE_KNOWLEDGE_GRAPH=true
      - KG_EXTRACTION_MODE=${KG_EXTRACTION_MODE:-noun_phrase_cooccurrence}
      - KG_NP_EXTRACTOR=${KG_NP_EXTRACTOR:-regex}
      - VECTOR_WEIGHT=0.4
      - BM25_WEIGHT=0.3
      - GRAPH_WEIGHT=0.3
      - RRF_K=60
      - FUSION_METHOD=${FUSION_METHOD:-dbsf}
      - GRAPH_TRAVERSAL_DEPTH=2
      - INDICES_DIR=/app/backend/uploads/indices
      - ENABLE_COMMUNITY_SUMMARIES=${ENABLE_COMMUNITY_SUMMARIES:-false}
      - COMMUNITY_SUMMARY_WEIGHT=${COMMUNITY_SUMMARY_WEIGHT:-0.2}
      # Phase 3: Agentic self-correction (opt-in; worst-case ~9–12 LLM calls with decomposition)
      # Override from shell: `ENABLE_AGENT=true docker compose up -d backend`
      - ENABLE_AGENT=${ENABLE_AGENT:-true}
      - AGENT_MAX_RETRIES=${AGENT_MAX_RETRIES:-2}
      - AGENT_CONFIDENCE_THRESHOLD=${AGENT_CONFIDENCE_THRESHOLD:-0.5}
      - AGENT_ROUTER_WEIGHT_BOOST=${AGENT_ROUTER_WEIGHT_BOOST:-0.15}
      # Phase 3.5: decomposition + RAG-Fusion (requires ENABLE_AGENT=true)
      - ENABLE_DECOMPOSITION=${ENABLE_DECOMPOSITION:-true}
      - AGENT_DECOMP_MAX_SUBQUERIES=${AGENT_DECOMP_MAX_SUBQUERIES:-3}
      - AGENT_DECOMP_MIN_WORDS=${AGENT_DECOMP_MIN_WORDS:-8}
      - AGENT_FUSION_RRF_K=${AGENT_FUSION_RRF_K:-60}
    depends_on:
      - mongo
      - qdrant
    restart: unless-stopped
    # This helps to ensure host.docker.internal works on all platforms
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"

  mongo:
    image: mongo:latest
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
  mongo_data:
  uploads_data:
  hf_cache:

    # networks: # Define if needed
    #   default:
